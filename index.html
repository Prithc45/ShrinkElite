<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShrinkElite By Nick</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --rgb-r: #ff3366;
    --rgb-g: #00ff88;
    --rgb-b: #3366ff;
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.12);
    --bg: #050510;
    --surface: rgba(10,10,30,0.7);
    --text: #e8e8ff;
    --muted: rgba(200,200,255,0.45);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  /* Hide native scrollbar */
  html {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  html::-webkit-scrollbar { display: none; }

  body {
    font-family: 'Exo 2', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ── Custom Scroll Indicator ── */
  #scroll-indicator {
    position: fixed;
    top: 0;
    right: 0;
    width: 6px;
    height: 100vh;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }

  /* Track */
  #scroll-track {
    position: absolute;
    top: 10px;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
  }

  /* Animated thumb */
  #scroll-thumb {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    min-height: 40px;
    border-radius: 10px;
    top: 10px;
    background: linear-gradient(180deg, #ff3366, #cc33ff, #3366ff, #00ff88);
    background-size: 100% 300%;
    animation: thumbRgb 3s linear infinite;
    box-shadow:
      0 0 8px rgba(255,51,102,0.7),
      0 0 20px rgba(51,102,255,0.4),
      0 0 40px rgba(0,255,136,0.2);
    transition: top 0.08s linear, height 0.08s linear;
  }

  #scroll-thumb::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 12px;
    background: inherit;
    filter: blur(6px);
    opacity: 0.5;
    z-index: -1;
  }

  @keyframes thumbRgb {
    0%   { background-position: 0% 0%; }
    100% { background-position: 0% 300%; }
  }

  /* Scroll percentage label */
  #scroll-label {
    position: fixed;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.0);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    z-index: 9999;
    pointer-events: none;
    transition: color 0.3s ease, opacity 0.3s ease;
    background: linear-gradient(180deg, #ff3366, #3366ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
  }

  body.scrolling #scroll-label {
    opacity: 1;
  }

  /* Top & bottom glow caps */
  #scroll-cap-top,
  #scroll-cap-bot {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  #scroll-cap-top {
    top: 10px;
    background: #ff3366;
    box-shadow: 0 0 8px #ff3366;
    animation: capPulse 2s ease-in-out infinite;
  }
  #scroll-cap-bot {
    bottom: 10px;
    background: #3366ff;
    box-shadow: 0 0 8px #3366ff;
    animation: capPulse 2s ease-in-out infinite reverse;
  }

  @keyframes capPulse {
    0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
    50%       { opacity: 1;   transform: translateX(-50%) scale(1.4); }
  }

  /* SVG progress ring (top-right corner) */
  #scroll-ring-wrap {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 40px;
    height: 40px;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  body.scrolling #scroll-ring-wrap { opacity: 1; }

  #scroll-ring-wrap svg { transform: rotate(-90deg); }

  .sr-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 3; }
  .sr-fg {
    fill: none;
    stroke: url(#srGrad);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 113;
    stroke-dashoffset: 113;
    transition: stroke-dashoffset 0.1s linear;
  }

  /* Animated RGB background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 60% at 10% 20%, rgba(255,51,102,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 80%, rgba(51,102,255,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 70% at 50% 50%, rgba(0,255,136,0.08) 0%, transparent 60%);
    animation: bgPulse 8s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  @keyframes bgPulse {
    0% { opacity: 0.7; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.05); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 30px 20px 60px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 50px;
    animation: slideDown 0.8s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes slideDown {
    from { opacity:0; transform: translateY(-40px); }
    to { opacity:1; transform: translateY(0); }
  }

  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 8px;
  }

  .logo-icon {
    animation: logoBob 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255,153,51,0.8)) drop-shadow(0 0 50px rgba(255,51,102,0.4));
  }

  .logo-icon img {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    display: block;
  }

  @keyframes logoBob {
    0%, 100% { transform: translateY(0) scale(1); }
    50%       { transform: translateY(-8px) scale(1.05); }
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #ff3366 0%, #ff9933 25%, #00ff88 50%, #3366ff 75%, #cc33ff 100%);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rgbShift 4s ease infinite;
  }

  @keyframes rgbShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .subtitle {
    font-size: 0.9rem;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 300;
    font-family: 'JetBrains Mono', monospace;
  }

  .badge {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--muted);
  }

  /* Glass card */
  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    position: relative;
    overflow: hidden;
  }

  .glass::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  }

  /* Drop Zone */
  .drop-zone {
    padding: 50px 30px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 2px dashed rgba(255,255,255,0.1);
    border-radius: 20px;
    margin-bottom: 30px;
    animation: fadeUp 0.8s 0.2s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(30px); }
    to { opacity:1; transform: translateY(0); }
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: rgba(51,102,255,0.6);
    background: rgba(51,102,255,0.06);
    transform: scale(1.01);
    box-shadow: 0 0 40px rgba(51,102,255,0.15), inset 0 0 40px rgba(51,102,255,0.05);
  }

  .drop-zone.dragover {
    border-color: var(--rgb-g);
    box-shadow: 0 0 60px rgba(0,255,136,0.2);
  }

  .upload-icon {
    margin-bottom: 20px;
    display: block;
  }

  .upload-icon svg {
    filter: drop-shadow(0 0 20px rgba(51,102,255,0.6));
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .drop-title {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: #fff;
  }

  .drop-sub {
    font-size: 0.85rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .browse-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 30px;
    border-radius: 50px;
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 1px;
    cursor: pointer;
    border: none;
    background: linear-gradient(135deg, #3366ff, #cc33ff);
    color: #fff;
    box-shadow: 0 4px 20px rgba(51,102,255,0.4);
    transition: all 0.3s ease;
    text-transform: uppercase;
  }

  .browse-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(51,102,255,0.6);
  }

  #fileInput { display: none; }

  /* Controls */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 30px;
    animation: fadeUp 0.8s 0.35s cubic-bezier(0.16,1,0.3,1) both;
  }

  @media(max-width:640px) { .controls { grid-template-columns: 1fr; } }

  .control-card {
    padding: 24px;
  }

  .control-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .ctrl-title {
    font-size: 0.78rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .ctrl-value {
    font-size: 1.6rem;
    font-weight: 900;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, #ff3366, #3366ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Slider */
  .slider-wrap {
    position: relative;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: visible;
    margin-top: 10px;
  }

  .slider-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    border-radius: 10px;
    background: linear-gradient(90deg, #ff3366, #3366ff, #00ff88);
    background-size: 200% 100%;
    animation: sliderRgb 3s linear infinite;
    transition: width 0.1s;
    pointer-events: none;
  }

  @keyframes sliderRgb {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    position: absolute;
    width: 100%; height: 100%;
    top: 0; left: 0;
    background: transparent;
    cursor: pointer;
    margin: 0;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(51,102,255,0.5), 0 4px 15px rgba(51,102,255,0.5);
    margin-top: -8px;
    transition: box-shadow 0.2s;
  }

  input[type=range]::-webkit-slider-thumb:hover {
    box-shadow: 0 0 0 5px rgba(51,102,255,0.4), 0 6px 20px rgba(51,102,255,0.7);
  }

  /* Format selector */
  .format-options {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }

  .fmt-btn {
    flex: 1;
    padding: 12px 8px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-transform: uppercase;
  }

  .fmt-btn:hover {
    border-color: rgba(255,255,255,0.25);
    color: #fff;
  }

  .fmt-btn.active {
    background: linear-gradient(135deg, rgba(51,102,255,0.25), rgba(204,51,255,0.25));
    border-color: rgba(51,102,255,0.6);
    color: #fff;
    box-shadow: 0 0 20px rgba(51,102,255,0.2);
  }

  .fmt-btn.png.active { border-color: rgba(0,255,136,0.6); background: rgba(0,255,136,0.1); box-shadow: 0 0 20px rgba(0,255,136,0.15); }
  .fmt-btn.jpg.active { border-color: rgba(255,153,51,0.6); background: rgba(255,153,51,0.1); box-shadow: 0 0 20px rgba(255,153,51,0.15); }
  .fmt-btn.webp.active { border-color: rgba(51,102,255,0.6); background: rgba(51,102,255,0.1); box-shadow: 0 0 20px rgba(51,102,255,0.15); }

  /* Image grid */
  .images-section {
    animation: fadeUp 0.8s 0.5s cubic-bezier(0.16,1,0.3,1) both;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 0 4px;
  }

  .section-title {
    font-size: 0.78rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .count-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    background: rgba(51,102,255,0.15);
    border: 1px solid rgba(51,102,255,0.3);
    color: rgba(100,150,255,1);
  }

  .images-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .img-card {
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    position: relative;
    transition: all 0.3s ease;
    animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes popIn {
    from { opacity:0; transform: scale(0.8) translateY(20px); }
    to { opacity:1; transform: scale(1) translateY(0); }
  }

  .img-card:hover {
    border-color: rgba(51,102,255,0.4);
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.4), 0 0 20px rgba(51,102,255,0.15);
  }

  .img-thumb {
    width: 100%;
    height: 140px;
    object-fit: cover;
    display: block;
  }

  .img-info {
    padding: 12px;
  }

  .img-name {
    font-size: 0.75rem;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 6px;
  }

  .size-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
  }

  .size-orig { color: var(--muted); }
  .size-new { color: var(--rgb-g); }
  .size-arrow {
    color: rgba(255,255,255,0.3);
    font-size: 0.6rem;
  }

  .savings-bar-wrap {
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
  }

  .savings-bar {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #00ff88, #3366ff);
    transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }

  .remove-btn {
    position: absolute;
    top: 8px; right: 8px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(255,51,102,0.15);
    border: 1px solid rgba(255,51,102,0.3);
    color: var(--rgb-r);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.2s;
    opacity: 0;
  }

  .img-card:hover .remove-btn { opacity: 1; }
  .remove-btn:hover {
    background: rgba(255,51,102,0.35);
    transform: scale(1.1);
  }

  .status-chip {
    position: absolute;
    top: 8px; left: 8px;
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 0.62rem;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .status-chip.ready {
    background: rgba(0,255,136,0.15);
    border: 1px solid rgba(0,255,136,0.3);
    color: var(--rgb-g);
  }

  .status-chip.processing {
    background: rgba(255,153,51,0.15);
    border: 1px solid rgba(255,153,51,0.3);
    color: #ff9933;
    animation: pulse 1s ease infinite;
  }

  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

  .status-chip.done {
    background: rgba(51,102,255,0.15);
    border: 1px solid rgba(51,102,255,0.3);
    color: #6699ff;
  }

  /* Action area */
  .action-area {
    margin-top: 30px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeUp 0.8s 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 32px;
    border-radius: 50px;
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  .btn-compress {
    background: linear-gradient(135deg, #ff3366, #ff9933);
    color: #fff;
    box-shadow: 0 4px 25px rgba(255,51,102,0.4);
  }

  .btn-compress:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 10px 35px rgba(255,51,102,0.6);
  }

  .btn-download {
    background: linear-gradient(135deg, #00ff88, #3366ff);
    color: #000;
    box-shadow: 0 4px 25px rgba(0,255,136,0.3);
  }

  .btn-download:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 10px 35px rgba(0,255,136,0.5);
  }

  .btn-clear {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--muted);
    box-shadow: none;
  }

  .btn-clear:hover {
    background: rgba(255,51,102,0.1);
    border-color: rgba(255,51,102,0.3);
    color: var(--rgb-r);
    transform: translateY(-2px);
  }

  .action-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    display: none;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 24px;
    padding: 20px;
    border-radius: 16px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    animation: fadeUp 0.8s 0.7s cubic-bezier(0.16,1,0.3,1) both;
    display: none;
  }

  .stat-item {
    text-align: center;
  }

  .stat-num {
    font-size: 1.4rem;
    font-weight: 900;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, var(--rgb-g), #3366ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .stat-label {
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
  }

  /* Particles */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: particleFloat linear infinite;
  }

  @keyframes particleFloat {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-100px) scale(1); opacity: 0; }
  }

  /* Glow orbs decorative */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.15;
  }

  .orb-1 {
    width: 400px; height: 400px;
    background: #ff3366;
    top: -100px; left: -100px;
    animation: orbMove1 10s ease-in-out infinite alternate;
  }

  .orb-2 {
    width: 350px; height: 350px;
    background: #3366ff;
    bottom: -100px; right: -100px;
    animation: orbMove2 12s ease-in-out infinite alternate;
  }

  .orb-3 {
    width: 300px; height: 300px;
    background: #00ff88;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: orbMove3 8s ease-in-out infinite alternate;
  }

  @keyframes orbMove1 { to { transform: translate(60px, 60px); } }
  @keyframes orbMove2 { to { transform: translate(-60px, -60px); } }
  @keyframes orbMove3 { 0% { opacity:0.08; } 100% { opacity:0.12; transform: translate(-50%,-50%) scale(1.3); } }

  /* Progress overlay */
  .progress-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,5,16,0.85);
    backdrop-filter: blur(10px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
  }

  .progress-overlay.show { display: flex; }

  .progress-ring {
    width: 100px; height: 100px;
    position: relative;
  }

  .progress-ring svg {
    transform: rotate(-90deg);
  }

  .progress-ring circle {
    fill: none;
    stroke-width: 6;
  }

  .ring-bg { stroke: rgba(255,255,255,0.08); }
  .ring-fg {
    stroke: url(#ringGrad);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s ease;
  }

  .progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 1.2rem;
    color: #fff;
  }

  .progress-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Notification */
  .notif {
    position: fixed;
    bottom: 30px;
    right: 30px;
    padding: 14px 24px;
    border-radius: 14px;
    glass: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0,255,136,0.3);
    background: rgba(0,255,136,0.08);
    color: var(--rgb-g);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    z-index: 200;
    transform: translateX(200px);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .notif.show { transform: translateX(0); opacity: 1; }

  /* Tooltip for format */
  .fmt-row { margin-top: 6px; }
</style>
</head>

          <stop offset="50%" stop-color="#00ff88"/>
          <stop offset="100%" stop-color="#3366ff"/>

    <div class="progress-text" id="progressPct">0%</div>

</div>

        <input type="range" id="qualitySlider" min="1" max="99" value="70">
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:0.65rem;font-family:'JetBrains Mono',monospace;color:var(--muted)">
        <span>Max Compress</span>
        <span>Best Quality</span>
      </div>
    </div>

    <div class="control-card glass">
      <div class="control-label">
        <span class="ctrl-title">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" style="display:inline;vertical-align:-2px;margin-right:4px">
            <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="2"/>
            <path d="M3 9h18" stroke="currentColor" stroke-width="2"/>
          </svg>
          Output Format
        </span>
      </div>
      <div class="format-options fmt-row">
        <button class="fmt-btn png active" data-fmt="png">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24" style="display:block;margin:0 auto 4px"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="2"/></svg>
          PNG
        </button>
        <button class="fmt-btn jpg" data-fmt="jpeg">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24" style="display:block;margin:0 auto 4px"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/></svg>
          JPG
        </button>
        <button class="fmt-btn webp" data-fmt="webp">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24" style="display:block;margin:0 auto 4px"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          WEBP
        </button>
      </div>
    </div>
  </div>

  <!-- Images Section -->
  <div class="images-section" id="imagesSection" style="display:none">
    <div class="section-header">
      <span class="section-title">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" style="display:inline;vertical-align:-2px;margin-right:4px">
          <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="2"/>
          <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
          <path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Loaded Images
      </span>
      <span class="count-badge" id="imageCount">0 / 10</span>
    </div>
    <div class="images-grid" id="imagesGrid"></div>

    <!-- Action Buttons -->
    <div class="action-area">
      <button class="action-btn btn-compress" id="compressBtn">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24">
          <path d="M12 2v10M12 22v-10M2 12h10M22 12h-10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2.5"/>
        </svg>
        Compress All
      </button>
      <button class="action-btn btn-download" id="downloadBtn" disabled>
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24">
          <path d="M12 4v12M7 11l5 5 5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 20h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        Download All
      </button>
      <button class="action-btn btn-clear" id="clearBtn">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24">
          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Clear
      </button>
    </div>

    <!-- Stats -->
    <div class="stats-bar glass" id="statsBar">
      <div class="stat-item">
        <div class="stat-num" id="statOrigSize">—</div>
        <div class="stat-label">Original Size</div>
      </div>
      <div style="width:1px;background:rgba(255,255,255,0.08)"></div>
      <div class="stat-item">
        <div class="stat-num" id="statNewSize">—</div>
        <div class="stat-label">Compressed Size</div>
      </div>
      <div style="width:1px;background:rgba(255,255,255,0.08)"></div>
      <div class="stat-item">
        <div class="stat-num" id="statSaved">—</div>
        <div class="stat-label">Space Saved</div>
      </div>
      <div style="width:1px;background:rgba(255,255,255,0.08)"></div>
      <div class="stat-item">
        <div class="stat-num" id="statPct">—</div>
        <div class="stat-label">Reduction</div>
      </div>
    </div>
  </div>
</div>

<!-- Custom Scroll Indicator -->
<div id="scroll-indicator">
  <div id="scroll-track"></div>
  <div id="scroll-cap-top"></div>
  <div id="scroll-thumb"></div>
  <div id="scroll-cap-bot"></div>
</div>

<div id="scroll-ring-wrap">
  <svg width="40" height="40" viewBox="0 0 40 40">
    <defs>
      <linearGradient id="srGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff3366"/>
        <stop offset="50%" stop-color="#00ff88"/>
        <stop offset="100%" stop-color="#3366ff"/>
      </linearGradient>
    </defs>
    <circle class="sr-bg" cx="20" cy="20" r="18"/>
    <circle class="sr-fg" id="srFg" cx="20" cy="20" r="18"/>
  </svg>
</div>

<div id="scroll-label">0%</div>

<script>
// ── Scroll Indicator Logic ──
(function() {
  const thumb = document.getElementById('scroll-thumb');
  const label = document.getElementById('scroll-label');
  const srFg  = document.getElementById('srFg');
  const track = document.getElementById('scroll-track');
  let scrollTimer;

  function onScroll() {
    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const pct = docHeight > 0 ? scrollTop / docHeight : 0;

    // Track bounds
    const trackTop = 10;
    const trackH   = window.innerHeight - 20;
    const thumbH   = Math.max(40, trackH * (window.innerHeight / document.documentElement.scrollHeight));
    const thumbTop = trackTop + pct * (trackH - thumbH);

    thumb.style.top    = thumbTop + 'px';
    thumb.style.height = thumbH  + 'px';

    // Ring progress
    const circ = 113;
    srFg.style.strokeDashoffset = circ - circ * pct;

    // Label
    label.textContent = Math.round(pct * 100) + '%';

    // Position label alongside thumb center
    const labelY = thumbTop + thumbH / 2;
    label.style.top       = labelY + 'px';
    label.style.transform = 'translateY(-50%)';

    // Show "scrolling" class
    document.body.classList.add('scrolling');
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => document.body.classList.remove('scrolling'), 1200);
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  onScroll(); // init
})();

// ── Particles ──
(function() {
  const container = document.getElementById('particles');
  const colors = ['#ff3366','#00ff88','#3366ff','#cc33ff','#ff9933'];
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*15+10}s;
      animation-delay:${Math.random()*10}s;
    `;
    container.appendChild(p);
  }
})();

// ── State ──
let images = []; // {file, src, origBlob, compressedBlob, status}
let outputFormat = 'png';
let quality = 0.70;

// ── Elements ──
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const browseBtn = document.getElementById('browseBtn');
const slider = document.getElementById('qualitySlider');
const sliderFill = document.getElementById('sliderFill');
const qualityVal = document.getElementById('qualityVal');
const imagesSection = document.getElementById('imagesSection');
const imagesGrid = document.getElementById('imagesGrid');
const imageCount = document.getElementById('imageCount');
const compressBtn = document.getElementById('compressBtn');
const downloadBtn = document.getElementById('downloadBtn');
const clearBtn = document.getElementById('clearBtn');
const statsBar = document.getElementById('statsBar');
const progressOverlay = document.getElementById('progressOverlay');
const ringFg = document.getElementById('ringFg');
const progressPct = document.getElementById('progressPct');

// ── Slider ──
slider.addEventListener('input', () => {
  const v = slider.value;
  quality = v / 100;
  qualityVal.textContent = v + '%';
  sliderFill.style.width = v + '%';
  // re-render size estimates
  images.forEach((img, i) => {
    if (img.status === 'done') updateCardSizes(i);
  });
});

// ── Format buttons ──
document.querySelectorAll('.fmt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fmt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    outputFormat = btn.dataset.fmt;
  });
});

// ── Drop zone ──
browseBtn.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
dropZone.addEventListener('click', () => fileInput.click());

dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles([...e.dataTransfer.files]);
});

fileInput.addEventListener('change', () => handleFiles([...fileInput.files]));

// ── Handle files ──
function handleFiles(files) {
  const imageFiles = files.filter(f => f.type.startsWith('image/'));
  const remaining = 10 - images.length;
  const toAdd = imageFiles.slice(0, remaining);

  if (toAdd.length < imageFiles.length) {
    showNotif(`Max 10 images — only added ${toAdd.length}`, '#ff9933');
  }

  toAdd.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const idx = images.length;
      images.push({ file, src: e.target.result, origBlob: file, compressedBlob: null, status: 'ready' });
      renderCard(idx);
      updateUI();
    };
    reader.readAsDataURL(file);
  });

  fileInput.value = '';
}

// ── Render card ──
function renderCard(idx) {
  const img = images[idx];
  const card = document.createElement('div');
  card.className = 'img-card';
  card.id = `card-${idx}`;
  card.style.animationDelay = (idx * 0.05) + 's';
  card.innerHTML = `
    <img class="img-thumb" src="${img.src}" alt="${img.file.name}">
    <span class="status-chip ready" id="chip-${idx}">Ready</span>
    <button class="remove-btn" onclick="removeImage(${idx})">
      <svg width="10" height="10" fill="none" viewBox="0 0 12 12">
        <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="img-info">
      <div class="img-name">${img.file.name}</div>
      <div class="size-row">
        <span class="size-orig" id="sorig-${idx}">${formatBytes(img.file.size)}</span>
        <span class="size-arrow">→</span>
        <span class="size-new" id="snew-${idx}">—</span>
      </div>
      <div class="savings-bar-wrap">
        <div class="savings-bar" id="sbar-${idx}" style="width:0%"></div>
      </div>
    </div>
  `;
  imagesGrid.appendChild(card);
}

function updateCardSizes(idx) {
  const img = images[idx];
  if (!img.compressedBlob) return;
  const newSize = img.compressedBlob.size;
  const origSize = img.origBlob.size;
  const pct = Math.max(0, (1 - newSize/origSize)*100);
  document.getElementById(`snew-${idx}`).textContent = formatBytes(newSize);
  document.getElementById(`sbar-${idx}`).style.width = pct + '%';
}

window.removeImage = (idx) => {
  images.splice(idx, 1);
  rebuildGrid();
  updateUI();
};

function rebuildGrid() {
  imagesGrid.innerHTML = '';
  images.forEach((_, i) => renderCard(i));
}

// ── Compress ──
compressBtn.addEventListener('click', async () => {
  if (!images.length) return;
  progressOverlay.classList.add('show');
  downloadBtn.disabled = true;

  for (let i = 0; i < images.length; i++) {
    setChip(i, 'processing', 'Compressing');
    await compressImage(i);
    setChip(i, 'done', 'Done');
    updateCardSizes(i);
    const pct = Math.round(((i+1)/images.length)*100);
    const offset = 276 - (276 * pct / 100);
    ringFg.style.strokeDashoffset = offset;
    progressPct.textContent = pct + '%';
  }

  progressOverlay.classList.remove('show');
  downloadBtn.disabled = false;
  updateStats();
  showNotif(`${images.length} image${images.length>1?'s':''} compressed!`);
  statsBar.style.display = 'flex';
});

function compressImage(idx) {
  return new Promise(resolve => {
    const img = images[idx];
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = image.width;
      canvas.height = image.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(image, 0, 0);
      const mime = `image/${outputFormat}`;
      canvas.toBlob(blob => {
        img.compressedBlob = blob;
        img.outputFormat = outputFormat;
        resolve();
      }, mime, quality);
    };
    image.src = img.src;
  });
}

// ── Download All ──
downloadBtn.addEventListener('click', async () => {
  const ready = images.filter(i => i.compressedBlob);
  if (!ready.length) return;

  for (let i = 0; i < ready.length; i++) {
    const img = ready[i];
    const ext = img.outputFormat === 'jpeg' ? 'jpg' : img.outputFormat;
    const baseName = img.file.name.replace(/\.[^.]+$/, '');
    const url = URL.createObjectURL(img.compressedBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${baseName}_shrunk.${ext}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // slight delay between downloads so browser doesn't block
    await new Promise(r => setTimeout(r, 200));
    URL.revokeObjectURL(url);
  }

  showNotif(`Downloaded ${ready.length} file${ready.length>1?'s':''}!`);
});

// ── Clear ──
clearBtn.addEventListener('click', () => {
  images = [];
  imagesGrid.innerHTML = '';
  updateUI();
  statsBar.style.display = 'none';
  downloadBtn.disabled = true;
});

// ── Helpers ──
function setChip(idx, cls, label) {
  const chip = document.getElementById(`chip-${idx}`);
  chip.className = `status-chip ${cls}`;
  chip.textContent = label;
}

function updateUI() {
  const count = images.length;
  imageCount.textContent = `${count} / 10`;
  imagesSection.style.display = count ? 'block' : 'none';
}

function updateStats() {
  const done = images.filter(i => i.compressedBlob);
  if (!done.length) return;
  const origTotal = done.reduce((a,i) => a + i.origBlob.size, 0);
  const newTotal = done.reduce((a,i) => a + i.compressedBlob.size, 0);
  const saved = origTotal - newTotal;
  const pct = Math.round((saved/origTotal)*100);
  document.getElementById('statOrigSize').textContent = formatBytes(origTotal);
  document.getElementById('statNewSize').textContent = formatBytes(newTotal);
  document.getElementById('statSaved').textContent = formatBytes(saved);
  document.getElementById('statPct').textContent = pct + '%';
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(2) + ' MB';
}

let notifTimer;
function showNotif(msg, color = '#00ff88') {
  const notif = document.getElementById('notif');
  document.getElementById('notifText').textContent = msg;
  notif.style.borderColor = color + '55';
  notif.style.color = color;
  notif.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => notif.classList.remove('show'), 3000);
}
</script>
</body>
</html>
